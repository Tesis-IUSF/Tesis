services:
  # ==========================================
  # Base de Datos (MySQL)
  # ==========================================
  db:
    image: mysql:8
    container_name: dev_db
    ports:
      - "${DB_PORT:-3306}:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dev_root_password}
      MYSQL_DATABASE: ${DB_NAME:-mi_app_dev}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASS:-dev_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-dev_root_password}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dev_phpmyadmin
    ports:
      - "8081:80"
    env_file:
      - .env
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dev_root_password}
    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # Backend (Spring Boot - Dev)
  # ==========================================
  backend:
    build:
      context: ./backend/demo
      dockerfile: Dockerfile
    container_name: dev_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: America/Caracas
      # Forzamos que el host sea el nombre del servicio de la DB en la red de Docker
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mi_app_dev}
      DB_USER: ${DB_USER:-admin}
      DB_PASS: ${DB_PASS:-dev_password}
      JWT_SECRET: ${JWT_SECRET}
      APP_SETUP_INITIAL_ADMIN_TOKEN: ${INITIAL_ADMIN_SETUP_TOKEN:-}
      UPLOADS_DIR: /app/uploads
      INSTITUCION_NOMBRE: ${INSTITUCION_NOMBRE:-C.E.N. Lcda. Roraima Asansa Escandela}
      INSTITUCION_DIRECTOR: ${INSTITUCION_DIRECTOR:-}
      INSTITUCION_RIF: ${INSTITUCION_RIF:-}
      INSTITUCION_CODIGO: ${INSTITUCION_CODIGO:-}
      INSTITUCION_DIRECCION: ${INSTITUCION_DIRECCION:-}
      INSTITUCION_TELEFONO: ${INSTITUCION_TELEFONO:-}
      INSTITUCION_CORREO: ${INSTITUCION_CORREO:-}
    volumes:
      - uploads_dev_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: dev_frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend

volumes:
  db_data:
  uploads_dev_data:
