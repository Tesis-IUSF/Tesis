services:
  # ==========================================
  # Base de Datos (MySQL)
  # ==========================================
  db:
    image: mysql:8
    container_name: dev_db
    ports:
      - "${DB_PORT:-3306}:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-mi_app_dev}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASS:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dev_phpmyadmin
    ports:
      - "8081:80"
    env_file:
      - .env
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # Backend (Spring Boot - Dev)
  # ==========================================
  backend:
    build:
      context: ./backend/demo
      dockerfile: Dockerfile
    container_name: dev_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: America/Caracas
      # Forzamos que el host sea el nombre del servicio de la DB en la red de Docker
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mi_app_dev}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-root}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: dev_frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend

volumes:
  db_data:
