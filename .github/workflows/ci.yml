name: Continuous Integration (CI)

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  # ==========================================
  # JOB 1: Validar Backend (Java 25 + Maven)
  # ==========================================
  backend-ci:
    name: Backend CI (Java 25)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend/demo  # Revisa que coincida con la ruta de tu pom.xml

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y empaquetar con Maven
        run: mvn clean package -DskipTests

  # ==========================================
  # JOB 2: Validar Frontend (Node.js + Build)
  # ==========================================
  frontend-ci:
    name: Frontend CI (Node 18)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend  # Revisa que coincida con la ruta de tu package.json

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Frontend
        run: npm run build