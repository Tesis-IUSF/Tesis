# ============================================================
# PERFIL DE TEST (Base de Datos H2 en memoria para CI/CD)
# ============================================================
server.port=8081

# Base de Datos H2 en Memoria (Compatibilidad en sintaxis con MySQL)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Accesible durante ejecución de tests si fuera necesario)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Clave JWT Ficticia para Pruebas Unitarias/Integración
jwt.secret=clave_secreta_de_prueba_para_ci_cd_environment_32_bytes
jwt.expiration=3600000
jwt.refreshExpiration=86400000

# Logging para ejecuciones de test
logging.level.root=WARN
logging.level.com.tuempresa=INFO
logging.level.org.springframework.test=INFO