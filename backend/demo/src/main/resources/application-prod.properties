# ============================================================
# PERFIL DE PRODUCCIÓN (Variables de Entorno estrictas)
# ============================================================
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.uploads.dir=${UPLOADS_DIR:/app/uploads}
app.institucion.nombre=${INSTITUCION_NOMBRE:C.E.N. Lcda. Roraima Asansa Escandela}
app.institucion.director=${INSTITUCION_DIRECTOR:}
app.institucion.rif=${INSTITUCION_RIF:}
app.institucion.codigo=${INSTITUCION_CODIGO:}
app.institucion.direccion=${INSTITUCION_DIRECCION:}
app.institucion.telefono=${INSTITUCION_TELEFONO:}
app.institucion.correo=${INSTITUCION_CORREO:}

# Base de Datos MySQL (Obligatorio proveer credenciales reales vía variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tesis}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de Conexiones Optimizado (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate (Solo valida esquema existente, nunca altera la estructura)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Clave JWT de Producción
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000
jwt.refreshExpiration=604800000
app.setup.initial-admin-token=${INITIAL_ADMIN_SETUP_TOKEN:}

# Logging restringido
logging.level.root=WARN
logging.level.com.tuempresa=INFO
logging.file.name=logs/app-prod.log
logging.file.max-size=50MB
logging.file.max-history=30