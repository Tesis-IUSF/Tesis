# ============================================================
# PERFIL DE TEST (Base de Datos H2 en memoria para CI/CD)
# ============================================================

# Base de Datos H2 en Memoria
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Claves JWT (Asegúrate de usar el prefijo 'app.')
app.jwt.secret=clave_secreta_de_prueba_para_ci_cd_environment_32_bytes
app.jwt.expiration=3600000

# Logging para ejecuciones de test
logging.level.root=WARN
logging.level.com.tesis=INFO
logging.level.org.springframework.test=INFO