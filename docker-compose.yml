version: '3.8'

services:
  # ==========================================
  # Base de Datos (MySQL)
  # ==========================================
  db:
    image: mysql:8
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword # Cambia esto por una contraseña segura si lo deseas
      MYSQL_DATABASE: tesis
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db    

  # ==========================================
  # Backend
  # ==========================================
  backend:
    build: 
      context: ./backend/demo
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: rootpassword
    volumes:
      # Volumen para habilitar live reload del código fuente
      - ./backend/src:/app/src
    depends_on:
      - db

  # ==========================================
  # Frontend
  # ==========================================
  frontend:
    build: 
      context: ./frontend
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      # Volumen para habilitar live reload del código fuente
      - ./frontend/src:/app/src
    depends_on:
      - db

# ==========================================
# Volúmenes con nombre (Persistencia)
# ==========================================
volumes:
  db_data: